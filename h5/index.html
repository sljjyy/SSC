<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小说生成助手 - H5版本</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#64748b',
                        accent: '#f43f5e',
                        dark: '#1e293b',
                        light: '#f8fafc'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .step-active {
                @apply bg-primary text-white border-primary;
            }
            .step-completed {
                @apply bg-green-500 text-white border-green-500;
            }
            .step-pending {
                @apply bg-gray-200 text-gray-500 border-gray-300;
            }
            .input-focus {
                @apply focus:ring-2 focus:ring-primary/50 focus:border-primary;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-dark">
    <!-- 顶部导航 -->
    <header class="bg-white shadow-sm fixed w-full top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <h1 class="text-xl font-bold text-primary flex items-center">
                <i class="fa fa-book mr-2"></i>
                <span>小说生成助手</span>
            </h1>
            <button id="configBtn" class="p-2 rounded-full hover:bg-gray-100">
                <i class="fa fa-cog text-gray-600"></i>
            </button>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="container mx-auto px-4 pt-24 pb-16">
        <!-- 步骤导航 -->
        <div class="mb-8">
            <div class="flex justify-between items-center">
                <div class="text-sm text-gray-500">创作进度</div>
                <div class="text-sm font-medium text-primary">
                    <span id="currentStepText">步骤 1/7</span>
                </div>
            </div>
            <!-- 步骤指示器 - 桌面版和移动版适配 -->
                <div class="mt-3 relative">
                    <!-- 连接线 -->
                    <div class="absolute top-1/2 left-0 right-0 h-1 bg-gray-200 -translate-y-1/2 z-0"></div>
                    
                    <!-- 步骤指示器容器 -->
                    <div class="flex justify-between relative z-10">
                        <div id="stepIndicator1" class="step-active flex flex-col items-center">
                            <div class="w-8 h-8 md:w-10 md:h-10 rounded-full flex items-center justify-center font-medium text-sm md:text-base border-2 mb-1 bg-primary text-white">1</div>
                            <span class="text-xs md:text-sm hidden md:inline whitespace-nowrap">参数</span>
                        </div>
                        <div id="stepIndicator2" class="step-pending flex flex-col items-center">
                            <div class="w-8 h-8 md:w-10 md:h-10 rounded-full flex items-center justify-center font-medium text-sm md:text-base border-2 mb-1 bg-white">2</div>
                            <span class="text-xs md:text-sm hidden md:inline whitespace-nowrap">选题</span>
                        </div>
                        <div id="stepIndicator3" class="step-pending flex flex-col items-center">
                            <div class="w-8 h-8 md:w-10 md:h-10 rounded-full flex items-center justify-center font-medium text-sm md:text-base border-2 mb-1 bg-white">3</div>
                            <span class="text-xs md:text-sm hidden md:inline whitespace-nowrap">人设</span>
                        </div>
                        <div id="stepIndicator4" class="step-pending flex flex-col items-center">
                            <div class="w-8 h-8 md:w-10 md:h-10 rounded-full flex items-center justify-center font-medium text-sm md:text-base border-2 mb-1 bg-white">4</div>
                            <span class="text-xs md:text-sm hidden md:inline whitespace-nowrap">粗纲</span>
                        </div>
                        <div id="stepIndicator5" class="step-pending flex flex-col items-center">
                            <div class="w-8 h-8 md:w-10 md:h-10 rounded-full flex items-center justify-center font-medium text-sm md:text-base border-2 mb-1 bg-white">5</div>
                            <span class="text-xs md:text-sm hidden md:inline whitespace-nowrap">细纲</span>
                        </div>
                        <div id="stepIndicator6" class="step-pending flex flex-col items-center">
                            <div class="w-8 h-8 md:w-10 md:h-10 rounded-full flex items-center justify-center font-medium text-sm md:text-base border-2 mb-1 bg-white">6</div>
                            <span class="text-xs md:text-sm hidden md:inline whitespace-nowrap">正文</span>
                        </div>
                        <div id="stepIndicator7" class="step-pending flex flex-col items-center">
                            <div class="w-8 h-8 md:w-10 md:h-10 rounded-full flex items-center justify-center font-medium text-sm md:text-base border-2 mb-1 bg-white">7</div>
                            <span class="text-xs md:text-sm hidden md:inline whitespace-nowrap">标题</span>
                        </div>
                    </div>
                </div>
        </div>

        <!-- 步骤内容区 -->
        <div id="stepContainer" class="bg-white rounded-xl shadow-sm p-5 min-h-[500px]">
            <!-- 步骤1：输入参数 -->
            <div id="step1" class="space-y-5">
                <h2 class="text-xl font-bold">基本参数设置</h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">平台选择</label>
                        <select id="platform" class="w-full rounded-lg border-gray-300 shadow-sm input-focus border px-3 py-2">
                            <option value="siliconflow">硅基流动</option>
                            <option value="deepseek">Deepseek</option>
                            <option value="openai">OpenAI</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">模型选择</label>
                        <select id="model" class="w-full rounded-lg border-gray-300 shadow-sm input-focus border px-3 py-2">
                            <option value="[16]千问">千问</option>
                            <option value="[4]千问长文">千问长文</option>
                            <option value="[4]腾讯混元">腾讯混元</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">故事类型</label>
                        <select id="storyType" class="w-full rounded-lg border-gray-300 shadow-sm input-focus border px-3 py-2">
                            <option value="都市情感">都市情感</option>
                            <option value="悬疑推理">悬疑推理</option>
                            <option value="玄幻仙侠">玄幻仙侠</option>
                            <option value="科幻未来">科幻未来</option>
                            <option value="历史穿越">历史穿越</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">困境类型</label>
                        <select id="dilemmaType" class="w-full rounded-lg border-gray-300 shadow-sm input-focus border px-3 py-2">
                            <option value="生存困境">生存困境</option>
                            <option value="情感纠葛">情感纠葛</option>
                            <option value="道德抉择">道德抉择</option>
                            <option value="理想与现实">理想与现实</option>
                            <option value="身份认同">身份认同</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">投稿平台</label>
                        <select id="publishPlatform" class="w-full rounded-lg border-gray-300 shadow-sm input-focus border px-3 py-2">
                            <option value="起点中文网">起点中文网</option>
                            <option value="番茄小说">番茄小说</option>
                            <option value="知乎故事">知乎故事</option>
                            <option value="小红书">小红书</option>
                            <option value="抖音">抖音</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">情绪类型</label>
                        <div class="flex flex-wrap gap-2">
                            <label class="inline-flex items-center">
                                <input type="checkbox" id="emotion1" value="爽文" checked class="rounded text-primary focus:ring-primary">
                                <span class="ml-1 text-sm">爽文</span>
                            </label>
                            <label class="inline-flex items-center">
                                <input type="checkbox" id="emotion2" value="虐心" class="rounded text-primary focus:ring-primary">
                                <span class="ml-1 text-sm">虐心</span>
                            </label>
                            <label class="inline-flex items-center">
                                <input type="checkbox" id="emotion3" value="恐怖" class="rounded text-primary focus:ring-primary">
                                <span class="ml-1 text-sm">恐怖</span>
                            </label>
                            <label class="inline-flex items-center">
                                <input type="checkbox" id="emotion4" value="治愈" class="rounded text-primary focus:ring-primary">
                                <span class="ml-1 text-sm">治愈</span>
                            </label>
                            <label class="inline-flex items-center">
                                <input type="checkbox" id="emotion5" value="感动" class="rounded text-primary focus:ring-primary">
                                <span class="ml-1 text-sm">感动</span>
                            </label>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">灵感输入（可选）</label>
                        <textarea id="inspiration" rows="3" placeholder="输入你的故事灵感或关键词..." class="w-full rounded-lg border-gray-300 shadow-sm input-focus border px-3 py-2"></textarea>
                    </div>
                </div>
            </div>

            <!-- 步骤2-7将通过JavaScript动态加载 -->
        </div>

        <!-- 底部操作按钮 -->
        <div class="mt-6 flex justify-between">
            <button id="prevBtn" class="px-4 py-2 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                <i class="fa fa-arrow-left mr-1"></i> 上一步
            </button>
            <button id="nextBtn" class="px-4 py-2 rounded-lg bg-primary text-white hover:bg-primary/90">
                开始生成 <i class="fa fa-arrow-right ml-1"></i>
            </button>
        </div>
    </main>

    <!-- 配置模态框 -->
    <div id="configModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-xl p-6 w-full max-w-md mx-4">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold">API配置</h3>
                <button id="closeConfigBtn" class="text-gray-500 hover:text-gray-700">
                    <i class="fa fa-times"></i>
                </button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Deepseek API Key</label>
                    <input type="text" id="deepseekApiKey" placeholder="your-deepseek-api-key" class="w-full rounded-lg border-gray-300 shadow-sm input-focus border px-3 py-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">硅基流动 API Key</label>
                    <input type="text" id="siliconflowApiKey" placeholder="your-siliconflow-api-key" class="w-full rounded-lg border-gray-300 shadow-sm input-focus border px-3 py-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">OpenAI API Key</label>
                    <input type="text" id="openaiApiKey" placeholder="your-openai-api-key" class="w-full rounded-lg border-gray-300 shadow-sm input-focus border px-3 py-2">
                </div>
            </div>
            <div class="mt-6">
                <button id="saveConfigBtn" class="w-full py-2 rounded-lg bg-primary text-white hover:bg-primary/90">
                    保存配置
                </button>
            </div>
        </div>
    </div>

    <!-- 加载动画 -->
    <div id="loadingModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-xl p-6 flex flex-col items-center">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary mb-4"></div>
            <p id="loadingText" class="text-gray-700">正在生成内容，请稍候...</p>
        </div>
    </div>

    <script src="prompts.js"></script>
    <script src="api.js"></script>
    <script src="app.js"></script>
</body>
</html>
